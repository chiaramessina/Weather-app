<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteo App Professionale</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-card">
        <h1>🌤️ Meteo </h1>
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Inserisci città (es: Roma)">
            <button id="searchBtn">Cerca</button>
        </div>

        <div id="result" class="result-area">
            <p>Inserisci una città per vedere il meteo in tempo reale.</p>
        </div>
    </div>

    <script src="meteo.js"></script>
</body>
</html>
